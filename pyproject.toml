[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fgpvdta"
version = "1.0.0"
description = "FGgraphDTA and PVgraphDTA preprocessing and reviewer experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "pillow==10.4.0", "pyyaml==6.0.2",
  "rdkit==2024.3.6", "scikit-learn==1.5.2", "scipy==1.14.1",
  "torch==2.4.1", "torchvision==0.19.1", "torch-geometric==2.6.1",
  "tqdm==4.66.5", "tabulate==0.9.0", "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9", "build==1.2.2.post1"]

[project.scripts]
fgpvdta = "fgpvdta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
